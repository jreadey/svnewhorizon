baseURL = 'https://svnewhorizon.space/'
locale = 'en-us'
title = 'SV New Horizon'
description = "John and Rong sailing adventures on a Fountaine Pajot Tanna 47"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
# theme = 'ananke'
# theme = 'hugo-PaperMod'

[params.profileMode]
  enabled = true
  title = "Voyages of New Horizon"
  subtitle = "Travel adventures on our FP Tanna 47 Catamaran"
  imageUrl = "images/sv_new_horizon.jpg"  # Path relative to static/ or assets/
  imageWidth = 120
  imageHeight = 120

  [[params.profileMode.buttons]]
    name = "Posts"
    url = "posts"

[params.assets]
  favicon = "/favicon.ico"
  favicon16x16 = "/favicon-16x16.png"
  favicon32x32 = "/favicon-32x32.png"
  apple_touch_icon = "/apple-touch-icon.png"


#    title = "New Horizon 航海日志"
#    [languages.zh.params]
#      subtitle = "地中海及远洋航行日志"

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"
    disable = false

[deployment]
  invalidateCDN = true

[[deployment.targets]]
  name = "production"
  URL = "s3://sv-new-horizon?region=us-east-1"
  cloudFrontDistributionID = "E1234567890ABC"